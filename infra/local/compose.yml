# Solo PostgreSQL de desarrollo; no despliega la aplicación ni SigNoz.
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: centro_salud
      POSTGRES_USER: centro_salud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro_salud -d centro_salud"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
